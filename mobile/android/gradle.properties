# Sized for a 16GB developer machine, NOT the Flutter template's default of
# -Xmx8G -XX:MaxMetaspaceSize=4G. That default asks for up to 12GB, which on a
# 13.9GB box with a browser and Docker open cannot be satisfied -- the JVM
# fails to reserve its heap and the build dies with the very unhelpful
# "Gradle build daemon disappeared unexpectedly (it may have been killed or
# may have crashed)". This project's module is small; 3GB is ample.
# Raise it if you genuinely hit an OutOfMemoryError, not on principle.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
